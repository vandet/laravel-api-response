name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Laravel 12 — testbench 10 — PHP 8.2 / 8.3 / 8.4
          - { php: "8.2", laravel: "12", testbench: "10" }
          - { php: "8.3", laravel: "12", testbench: "10" }
          - { php: "8.4", laravel: "12", testbench: "10" }
          # Laravel 13 — testbench 11 — PHP 8.3 / 8.4 (requires PHP 8.3+)
          - { php: "8.3", laravel: "13", testbench: "11" }
          - { php: "8.4", laravel: "13", testbench: "11" }

    name: PHP ${{ matrix.php }} — Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, json
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache
          key: php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-

      - name: Pin Laravel and Testbench versions
        run: |
          composer require --dev \
            "orchestra/testbench:^${{ matrix.testbench }}" \
            "illuminate/http:^${{ matrix.laravel }}" \
            "illuminate/support:^${{ matrix.laravel }}" \
            "illuminate/auth:^${{ matrix.laravel }}" \
            "illuminate/database:^${{ matrix.laravel }}" \
            "illuminate/pagination:^${{ matrix.laravel }}" \
            "illuminate/validation:^${{ matrix.laravel }}" \
            --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress --no-audit

      - name: Run tests
        run: ./vendor/bin/phpunit
